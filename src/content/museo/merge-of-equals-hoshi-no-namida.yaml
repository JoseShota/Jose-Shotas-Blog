descripcion: |-
  La vestimenta es una característica innegable del ser humano moderno. Un ser consciente de sí mismo y de su entorno. Dentro de una sociedad económica, la vestimenta vive en un dilema fundacional. La expresión de un ser consciente que tapa su cuerpo de su entorno y la necesidad de un bien, que es privado, básico.
descripcionEn: |-
  Clothing is an undeniable trait of modern human beings: beings aware of themselves and their surroundings. Within an economic society, clothing lives in a founding dilemma: the expression of a conscious being who covers its body from its surroundings, and the need for a good that is private and basic.
