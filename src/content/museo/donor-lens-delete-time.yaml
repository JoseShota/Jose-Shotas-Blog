descripcion: |-
  La actualidad se presenta como algo inimaginable, pero eso no nos detiene a pensar en el futuro. Al final, el futuro no es más que una predicción que nace de lo vivido. El pasado acompaña al porvenir como su punto de referencia inevitable. En la vida virtual, la nostalgia toma forma y se convierte en materia palpable.
descripcionEn: |-
  The present feels unimaginable, yet that does not stop us from thinking about the future. In the end, the future is nothing more than a prediction born from what we have lived. The past accompanies what is to come as its inevitable point of reference. In virtual life, nostalgia takes shape and becomes tangible matter.
