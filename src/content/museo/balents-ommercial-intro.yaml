descripcion: |-
  Los vestigios de las primeras sociedades nos ofrecen ideas que pudieron ser, que fueron y que nunca volverán a ser. La nostalgia encierra uno de los conceptos más intrigantes para el ser humano. Sabemos qué se siente extrañar, pero este impulso no se limita sólo a experiencias vividas; a veces nace de ideas que nos resultan atractivas. Es más sencillo pensar en lo que ya experimentamos, por eso la nostalgia suele remitirse a momentos importantes de nuestra vida. Pero ¿por qué añoramos ideas que nunca llegaron a existir? Quizá el simple hecho de haberlas imaginado las vuelve posibles.
descripcionEn: |-
  The remnants of the first societies offer us ideas that could have been, that were, and that will never be again. Nostalgia holds one of the most intriguing concepts for human beings. We know what missing something feels like, but this impulse is not limited to lived experiences; sometimes it is born from ideas we find attractive. It is easier to think about what we have already experienced, which is why nostalgia usually points back to important moments of our lives. But why do we long for ideas that never came to exist? Perhaps the simple fact of having imagined them makes them possible.
