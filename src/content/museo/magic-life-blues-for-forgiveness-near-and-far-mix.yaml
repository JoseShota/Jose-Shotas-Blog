descripcion: |-
  Hoy es día de Lounge en Santorini. Magic Life nos brinda una canción con melodias clásicas del Lounge y ondas psicotrópicas. Blues for Forgiveness (2009) se siente como un sueño muy confuso pero tan atractivo que te captura por su extrañez.
