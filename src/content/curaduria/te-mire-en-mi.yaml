descripcion: |-
  Nunca olvidaré su voz. 'Ya cállate', decía con esa mueca tan peculiar. Del folk y otras misceláneas latinas, te miré en mí.
descripcionEn: |-
  I will never forget her voice. 'Oh, shut up,' she would say, with that peculiar grimace of hers. Folk and other Latin miscellanea: I saw you in me.
